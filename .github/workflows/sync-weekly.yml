name: sync-weekly
on:
  push:
    paths:
      - '.github/workflows/sync-weekly.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download data_lite.json
        env:
          LITE_URL: https://aka.doubaocdn.com/s/JFGJONvcPE
        run: curl -fL --retry 3 --retry-delay 5 -o data_lite.json "$LITE_URL"
      - name: Download index.html
        env:
          PAGE_URL: https://aka.doubaocdn.com/s/velAbE5R9b
        run: curl -fL --retry 3 --retry-delay 5 -o index.html "$PAGE_URL"
      - name: Verify payload
        run: python3 -c "import json; d=json.load(open('data_lite.json')); print(d['_meta']['data_version'], d['_meta']['total_mods'], d['_meta']['total_rules'])"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_lite.json index.html
          git commit -m "chore(data): weekly carpet sync 2026-11-22 (154 mods / 3385 rules)"
          git push
