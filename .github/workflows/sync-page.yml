name: sync-page
on:
  push:
    paths:
      - '.github/workflows/sync-page.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download index.html
        env:
          SRC_URL: https://aka.doubaocdn.com/s/0kQBVJPsjN
        run: curl -fL --retry 3 --retry-delay 5 -o index.html "$SRC_URL"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(page): rebuild index.html (2026-11-15, 138 mods / 3246 rules)"
          git push
