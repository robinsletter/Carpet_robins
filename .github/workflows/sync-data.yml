name: sync-data
on:
  push:
    paths:
      - '.github/workflows/sync-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download data_lite.json
        env:
          SRC_URL: https://aka.doubaocdn.com/s/26mIUH8Qi9
        run: curl -fL --retry 3 --retry-delay 5 -o data_lite.json "$SRC_URL"
      - name: Verify payload
        run: python3 -c "import json; d=json.load(open('data_lite.json')); print(d['_meta'])"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_lite.json
          git commit -m "chore(data): refresh data_lite.json (2026-11-15, 138 mods / 3246 rules)"
          git push
